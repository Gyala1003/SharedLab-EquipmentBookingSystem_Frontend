<header
  class="sticky top-0 z-30 transition-all duration-300 backdrop-blur-md"
  [class]="
    isScrolled()
      ? 'bg-white/90 border-b border-slate-200/80 shadow-sm'
      : 'bg-white/60 border-b border-transparent'
  "
>
  <div class="mx-auto flex h-20 w-full items-center justify-between px-4 sm:px-6 lg:px-8">
    <!-- LEFT: Logo & Sidebar Toggle -->
    <div class="flex items-center gap-3">
      @if (store.isAuthenticated()) {
        <button
          type="button"
          class="flex h-10 w-10 items-center justify-center rounded-xl border border-slate-200 bg-white text-slate-600 hover:bg-slate-50 lg:hidden"
          (click)="onToggleSidebar()"
        >
          <app-icon name="menu" [size]="20" />
        </button>
      }

      <a routerLink="/" class="flex items-center gap-3">
        <div
          class="flex h-11 w-11 items-center justify-center rounded-2xl bg-brand-500 text-white shadow-lg shadow-brand-500/25"
        >
          <app-icon name="flask" [size]="24" />
        </div>
        <div class="min-w-0">
          <p class="text-[10px] font-black tracking-[0.24em] text-brand-600 uppercase">
            {{ 'app.name' | t }}
          </p>
          <p class="mt-0.5 truncate text-sm font-black text-slate-900">{{ 'app.tagline' | t }}</p>
        </div>
      </a>
    </div>

    <!-- RIGHT: Actions & Dynamic Menu -->
    <div class="flex items-center gap-3">
      <!-- Language Switcher -->
      <div
        class="hidden items-center gap-1 rounded-full border border-slate-200 bg-slate-100/80 p-1 sm:flex"
      >
        @for (item of languages; track item.code) {
          <button
            type="button"
            class="rounded-full px-3 py-1 text-xs font-bold transition-all duration-200"
            [class]="
              item.code === currentLang()
                ? 'bg-brand-500 text-white shadow-sm'
                : 'text-slate-600 hover:text-brand-600'
            "
            (click)="changeLanguage(item.code)"
          >
            {{ item.flag }} {{ item.label }}
          </button>
        }
      </div>

      <!-- User Actions (Auth vs Guest) -->
      @if (store.isAuthenticated()) {
        <a
          routerLink="/app/calendar"
          class="hidden h-11 items-center gap-2 rounded-2xl border border-slate-200 bg-white px-4 text-xs font-bold text-slate-700 shadow-sm transition hover:border-brand-300 hover:bg-brand-50/50 hover:text-brand-600 sm:flex"
        >
          <app-icon name="calendar" [size]="18" class="text-slate-500" />
          <span>{{ 'header.viewCalendar' | t }}</span>
        </a>

        <a
          routerLink="/app/notifications"
          class="relative flex h-11 w-11 items-center justify-center rounded-2xl border border-slate-200 bg-white text-slate-600 shadow-sm transition hover:border-brand-300 hover:text-brand-600"
          aria-label="Notifications"
        >
          <app-icon name="bell" [size]="20" />
          @if (badge.count() > 0) {
            <span
              class="absolute top-2 right-2 h-2.5 w-2.5 rounded-full bg-rose-500 ring-2 ring-white"
            ></span>
          }
        </a>

        <app-user-menu />
      } @else {
        <a routerLink="/auth/login" class="btn-primary !h-11 !px-5 !text-xs font-bold">
          {{ 'header.login' | t }}
        </a>
      }
    </div>
  </div>
</header>
