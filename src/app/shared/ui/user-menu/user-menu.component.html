<div class="relative">
  <button
    type="button"
    class="flex items-center gap-2 rounded-full border border-transparent p-0.5 transition-colors hover:border-gray-200"
    (click)="toggle()"
  >
    <app-letter-avatar [fullName]="displayName()" [size]="36" />
  </button>

  @if (isOpen()) {
    <div class="absolute right-0 mt-2 w-64 overflow-hidden rounded-lg border border-gray-200 bg-white shadow-lg">
      <div class="flex items-center gap-3 px-4 py-3">
        <app-letter-avatar [fullName]="displayName()" [size]="40" />
        <div class="min-w-0">
          <p class="truncate text-sm font-semibold text-gray-900">{{ user()?.fullName }}</p>
          <p class="truncate text-xs text-gray-500">{{ user()?.email }}</p>
        </div>
      </div>

      <div class="border-t border-gray-100"></div>

      <button
        type="button"
        [disabled]="isLoggingOut()"
        class="flex w-full items-center gap-2.5 px-4 py-2.5 text-sm font-medium text-red-600 transition-colors hover:bg-red-50 disabled:cursor-not-allowed disabled:opacity-60"
        (click)="onLogout()"
      >
        @if (isLoggingOut()) {
          <span class="h-4 w-4 animate-spin rounded-full border-2 border-red-600 border-t-transparent"></span>
        } @else {
          <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M9 21H5C4.4 21 4 20.6 4 20V4C4 3.4 4.4 3 5 3H9" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M16 17L21 12L16 7" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M21 12H9" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
          </svg>
        }
        {{ 'nav.logout' | translate }}
      </button>
    </div>
  }
</div>
