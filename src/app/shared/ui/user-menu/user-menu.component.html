<div class="relative">
  <button
    type="button"
    class="flex items-center gap-2 rounded-full border border-cyan-100 p-0.5 transition hover:border-cyan-300 hover:shadow-sm"
    (click)="toggle()"
  >
    <app-letter-avatar [fullName]="displayName()" [size]="36" />
  </button>

  @if (isOpen()) {
    <div
      class="animate-in fade-in zoom-in-95 absolute right-0 z-50 mt-2 w-64 overflow-hidden rounded-3xl border border-slate-100 bg-white p-3 shadow-2xl"
    >
      <div class="flex items-center gap-3 px-3 py-2">
        <app-letter-avatar [fullName]="displayName()" [size]="40" />
        <div class="min-w-0 flex-1">
          <p class="truncate text-xs font-black text-slate-900">{{ user()?.fullName }}</p>
          <p class="mt-0.5 truncate text-[10px] font-medium text-slate-400">{{ user()?.email }}</p>
        </div>
      </div>

      <div class="my-2 border-t border-slate-100"></div>

      <button
        type="button"
        [disabled]="isLoggingOut()"
        class="flex w-full items-center gap-2.5 rounded-2xl px-3 py-2 text-xs font-black text-rose-600 transition hover:bg-rose-50 disabled:cursor-not-allowed disabled:opacity-60"
        (click)="onLogout()"
      >
        @if (isLoggingOut()) {
          <span
            class="h-4 w-4 animate-spin rounded-full border-2 border-rose-600 border-t-transparent"
          ></span>
        } @else {
          <svg
            class="h-4 w-4 stroke-rose-600"
            viewBox="0 0 24 24"
            fill="none"
            xmlns="http://www.w3.org/2000/svg"
          >
            <path
              d="M9 21H5C4.4 21 4 20.6 4 20V4C4 3.4 4.4 3 5 3H9"
              stroke-width="1.8"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
            <path
              d="M16 17L21 12L16 7"
              stroke-width="1.8"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
            <path d="M21 12H9" stroke-width="1.8" stroke-linecap="round" />
          </svg>
        }
        {{ 'sidebar.logout' | t }}
      </button>
    </div>
  }
</div>
