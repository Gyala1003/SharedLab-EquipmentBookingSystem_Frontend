<section id="statistics" class="bg-blue-600 py-20">
  <div class="mx-auto max-w-7xl px-4 sm:px-6 lg:px-8">
    <div class="grid grid-cols-2 gap-8 text-center lg:grid-cols-4">
      @for (stat of stats; track stat.labelKey) {
        <div>
          <p class="text-4xl font-bold text-white sm:text-5xl">
            {{ formatValue(stat.value()) }}{{ stat.suffix }}
          </p>
          <p class="mt-2 text-sm font-medium text-blue-100">{{ stat.labelKey | translate }}</p>
        </div>
      }
    </div>
  </div>
</section>
