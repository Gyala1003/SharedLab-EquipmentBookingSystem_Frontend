<section class="flex min-h-[calc(100vh-4rem)] items-center justify-center bg-gray-50 px-4 py-16">
  <div class="w-full max-w-md">
    <div class="rounded-2xl border border-gray-200 bg-white p-8 shadow-xl">
      <div class="text-center">
        <h1 class="text-xl font-bold text-gray-900">{{ 'auth.forgotPasswordTitle' | t }}</h1>
      </div>

      @if (status() === 'success') {
        <div
          class="mt-6 flex items-start gap-2.5 rounded-lg border border-emerald-200 bg-emerald-50 px-4 py-3"
        >
          <svg
            class="mt-0.5 h-4.5 w-4.5 shrink-0 text-emerald-500"
            viewBox="0 0 24 24"
            fill="none"
            xmlns="http://www.w3.org/2000/svg"
          >
            <circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.6" />
            <path
              d="M8 12.5L10.5 15L16 9"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
          </svg>
          <p class="text-sm font-medium text-emerald-700">
            {{ 'auth.success.resetEmailSent' | t }}
          </p>
        </div>

        <a
          routerLink="/auth/login"
          class="mt-6 flex items-center justify-center rounded-lg border border-gray-300 px-4 py-2.5 text-sm font-semibold text-gray-700 transition-colors hover:bg-gray-50"
        >
          {{ 'auth.backToLogin' | t }}
        </a>
      } @else {
        @if (errorKind()) {
          <div class="mt-6 rounded-lg border border-red-200 bg-red-50 px-4 py-3">
            <p class="text-sm font-medium text-red-700">
              {{
                (errorKind() === 'tooManyRequests' ? 'auth.error.tooManyRequests' : 'common.error')
                  | t
              }}
            </p>
          </div>
        }

        <form class="mt-6 flex flex-col gap-5" [formGroup]="form" (ngSubmit)="submit()">
          <label class="flex flex-col gap-1.5">
            <span class="text-sm font-medium text-gray-700">{{ 'auth.email' | t }}</span>
            <!-- Forgot password: email only -->
            <input
              type="email"
              formControlName="email"
              autocomplete="email"
              class="w-full rounded-lg border border-gray-300 px-3 py-2.5 text-sm focus:border-blue-500 focus:ring-2 focus:ring-blue-100 focus:outline-none"
            />
            @if (form.controls.email.touched && form.controls.email.hasError('required')) {
              <span class="text-xs text-red-600">{{ 'auth.error.required' | t }}</span>
            } @else if (form.controls.email.touched && form.controls.email.invalid) {
              <span class="text-xs text-red-600">{{ 'auth.error.invalidEmail' | t }}</span>
            }
          </label>

          <div class="mt-2 flex flex-col gap-3">
            <button
              type="submit"
              [disabled]="form.invalid || status() === 'loading'"
              class="flex items-center justify-center gap-2 rounded-lg bg-blue-600 px-4 py-2.5 text-sm font-semibold text-white transition-colors hover:bg-blue-700 disabled:cursor-not-allowed disabled:opacity-60"
            >
              @if (status() === 'loading') {
                <span
                  class="h-4 w-4 animate-spin rounded-full border-2 border-white border-t-transparent"
                ></span>
              }
              {{ 'auth.sendResetLinkBtn' | t }}
            </button>

            <a
              routerLink="/auth/login"
              class="flex items-center justify-center rounded-lg border border-gray-300 px-4 py-2.5 text-sm font-semibold text-gray-700 transition-colors hover:bg-gray-50"
            >
              {{ 'auth.backToLogin' | t }}
            </a>
          </div>
        </form>
      }
    </div>
  </div>
</section>
